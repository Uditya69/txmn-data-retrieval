services:
  model-gateway:
    build:
      context: .
      dockerfile: packages/model-gateway/Dockerfile
    ports: ["8001:8001"]
    env_file: .env

  retrieval-api:
    build:
      context: .
      dockerfile: packages/retrieval-api/Dockerfile
    ports: ["8000:8000"]
    env_file: .env
    environment:
      GATEWAY_URL: http://model-gateway:8001
    depends_on: [model-gateway]
