services:
  model-gateway:
    build:
      context: .
      dockerfile: packages/model-gateway/Dockerfile
    ports: ["8001:8001"]
    env_file: .env

  retrieval-api:
    build:
      context: .
      dockerfile: packages/retrieval-api/Dockerfile
    ports: ["8010:8000"]
    env_file: .env
    environment:
      GATEWAY_URL: http://model-gateway:8001
    depends_on: [model-gateway]

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    ports: ["8501:80"]
    environment:
      WS_URL: ws://retrieval-api:8000/ws/search
    depends_on: [retrieval-api]
