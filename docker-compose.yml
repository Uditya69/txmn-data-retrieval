services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes:
      - mongo-data:/data/db

  model-gateway:
    build:
      context: .
      dockerfile: packages/model-gateway/Dockerfile
    ports: ["8001:8001"]
    env_file: .env

  retrieval-api:
    build:
      context: .
      dockerfile: packages/retrieval-api/Dockerfile
    ports: ["8010:8000"]
    env_file: .env
    environment:
      GATEWAY_URL: http://model-gateway:8001
      MONGO_URI: mongodb://mongo:27017
    depends_on: [model-gateway, mongo]

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    ports: ["8501:80"]
    environment:
      # The websocket connection is made client-side, from the user's
      # browser on the host - not server-side inside the compose network
      # (unlike the old Streamlit app). Must be the host-mapped port.
      WS_URL: ws://localhost:8010/ws/search
      AGENT_WS_URL: ws://localhost:8010/ws/agent
    depends_on: [retrieval-api]

volumes:
  mongo-data:
