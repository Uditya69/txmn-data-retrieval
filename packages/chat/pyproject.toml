[project]
name = "chat"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "motor>=3.5",
  "pydantic-settings>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chat"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
