[project]
name = "retrieval-api"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "langchain-core>=0.3",
  "langfuse>=4.14",
  "common",
]

[project.scripts]
retrieval-eval = "retrieval_api.retrieval_eval:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retrieval_api"]
