[project]
name = "common"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pydantic-settings>=2.5",
  "pymilvus>=2.4",
  "elasticsearch>=8.15,<9",
  "aiohttp>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
